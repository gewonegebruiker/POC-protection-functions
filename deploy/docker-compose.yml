# Docker Compose deployment for SEAPATH hypervisor
#
# Each bay IED container is pinned to a dedicated CPU core and uses
# host networking for direct layer-2 access to the process bus.
#
# Usage:
#   docker compose up -d
#
# Requirements:
#   - SEAPATH / PREEMPT_RT kernel
#   - SR-IOV VFs configured on the NIC (see deploy/setup-seapath-host.sh)
#   - PTP synchronised via ptp4l/phc2sys (ptp-sync service below)

services:
  # -------------------------------------------------------------------------
  # Bay 1 IED
  # -------------------------------------------------------------------------
  bay1-ied:
    image: poc-ied:latest
    container_name: bay1-ied
    network_mode: host
    environment:
      - IED_CONFIG=/config/bay1.json
      - RUST_LOG=info
    volumes:
      - ./config:/config:ro
    cpuset: "3"
    mem_limit: 256m
    memswap_limit: 256m
    cap_add:
      - SYS_NICE
      - NET_RAW
      - NET_ADMIN
      - IPC_LOCK
    ulimits:
      rtprio:
        soft: 99
        hard: 99
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Bay 2 IED
  # -------------------------------------------------------------------------
  bay2-ied:
    image: poc-ied:latest
    container_name: bay2-ied
    network_mode: host
    environment:
      - IED_CONFIG=/config/bay2.json
      - RUST_LOG=info
    volumes:
      - ./config:/config:ro
    cpuset: "4"
    mem_limit: 256m
    memswap_limit: 256m
    cap_add:
      - SYS_NICE
      - NET_RAW
      - NET_ADMIN
      - IPC_LOCK
    ulimits:
      rtprio:
        soft: 99
        hard: 99
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # PTP synchronisation service
  # Runs ptp4l and phc2sys on dedicated core 2, isolated from IED workloads.
  # Replace <PTP_IFACE> with your hardware-timestamping NIC interface.
  # -------------------------------------------------------------------------
  ptp-sync:
    image: debian:bookworm-slim
    container_name: ptp-sync
    network_mode: host
    privileged: true
    cpuset: "2"
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq linuxptp &&
               ptp4l -i eth0 -2 -s --summary_interval 60 &
               phc2sys -s eth0 -c CLOCK_REALTIME -w --summary_interval 60"
    restart: unless-stopped
